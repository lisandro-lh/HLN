<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Lomba HLN UP3 Tobelo 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(229, 231, 235, 1); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .hidden-section { display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .match-card { background: #ffffff; border-left: 4px solid #3b82f6; transition: transform 0.2s; }
        .match-card:hover { transform: scale(1.02); border-left-color: #f59e0b; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen font-sans text-gray-800">

    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/97/Logo_PLN.png" alt="Logo PLN" class="h-10 md:h-12 object-contain">
            <div class="text-center flex-1 mx-4">
                <h1 class="text-lg md:text-2xl font-extrabold text-blue-900 tracking-tight">HLN UP3 TOBELO 2026</h1>
                <p class="text-xs md:text-sm text-gray-600 font-medium mt-1">Dashboard Pendaftaran & Bagan Lomba</p>
            </div>
            <img src="danantara.png" alt="Logo Danantara" class="h-10 md:h-12 object-contain rounded-md">
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 text-center max-w-2xl mx-auto border-t-4 border-blue-600">
            <label for="lomba-select" class="block text-lg font-bold text-gray-700 mb-3">
                <i class="fa-solid fa-trophy text-yellow-500 mr-2"></i>Pilih Cabang Lomba:
            </label>
            <div class="flex flex-col md:flex-row gap-3 justify-center items-center">
                <select id="lomba-select" onchange="showLombaDetails()" class="w-full md:w-3/4 text-lg p-3 border-2 border-blue-200 rounded-lg focus:outline-none focus:border-blue-600 bg-blue-50 font-semibold text-blue-900">
                    <option value="">-- Silakan Pilih Lomba --</option>
                    <option value="Ludo">Ludo</option>
                    <option value="Domino">Domino</option>
                    <option value="Volly">Bola Volly</option>
                    <option value="PS 5">PlayStation 5</option>
                    <option value="Badminton">Badminton</option>
                    <option value="Tenis Meja">Tenis Meja</option>
                    <option value="Karaoke">Karaoke</option>
                    <option value="Cerdas Cermat">Cerdas Cermat</option>
                </select>
                <button onclick="showLombaDetails()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg w-full md:w-auto shadow-md transition duration-200">
                    <i class="fa-solid fa-rotate-right mr-2"></i>Segarkan
                </button>
            </div>
        </div>

        <div id="detail-section" class="hidden-section">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Daftar Tim & Peserta -->
                <div class="glass-card rounded-2xl p-6 flex flex-col h-[600px]">
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <h3 class="text-xl font-bold text-blue-900" id="judul-peserta">Daftar Tim & Peserta</h3>
                    </div>
                    <div class="bg-white rounded-lg p-2 border border-gray-100 flex-1 overflow-y-auto" id="list-peserta">
                        <div class="text-center text-gray-500 mt-10">Memuat data...</div>
                    </div>
                </div>

                <!-- Bagan Lomba (DINAMIS SESUAI JENIS LOMBA) -->
                <div class="glass-card rounded-2xl p-6 flex flex-col h-[600px]">
                    <div class="mb-4 border-b pb-3">
                        <h3 class="text-xl font-bold text-blue-900" id="judul-bagan">Bagan Pertandingan</h3>
                        <p class="text-xs text-gray-500 mt-1" id="info-bagan-tipe"><i class="fa-solid fa-sitemap mr-1"></i>Format menyesuaikan otomatis</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex-1 overflow-y-auto relative shadow-inner" id="bagan-container">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // PASTIKAN URL INI MASIH SAMA DENGAN YANG TERBARU MILIK ANDA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxqEeykjmYojUkO3SNrg20HwOHmOntRpGRNfLclIDlSa8RZ2C3YD9Zq6KtCGG6BQSVf/exec';

        function showLombaDetails() {
            const select = document.getElementById('lomba-select');
            const section = document.getElementById('detail-section');
            const listPeserta = document.getElementById('list-peserta');
            const baganContainer = document.getElementById('bagan-container');
            
            if(select.value !== "") {
                section.classList.remove('hidden-section');
                const namaSheet = select.value; 
                
                document.getElementById('judul-peserta').innerText = "Data " + select.options[select.selectedIndex].text;
                document.getElementById('judul-bagan').innerText = "Bagan " + select.options[select.selectedIndex].text;
                
                listPeserta.innerHTML = '<div class="loader"></div><p class="text-center text-gray-500 text-sm mt-2">Menarik data dari Sheet...</p>';
                baganContainer.innerHTML = '<div class="loader"></div>';

                fetch(SCRIPT_URL + "?sheet=" + encodeURIComponent(namaSheet))
                    .then(response => response.json())
                    .then(result => {
                        if(result.error) {
                            listPeserta.innerHTML = `<p class="text-red-500 text-center font-bold mt-5"><i class="fa-solid fa-triangle-exclamation"></i> ${result.error}</p>`;
                            baganContainer.innerHTML = '';
                            return;
                        }
                        prosesDataPeserta(result.data, namaSheet);
                    })
                    .catch(error => {
                        listPeserta.innerHTML = `<p class="text-red-500 text-center">Gagal menyambung ke server.</p>`;
                        baganContainer.innerHTML = '';
                    });
            } else {
                section.classList.add('hidden-section');
            }
        }

        function prosesDataPeserta(data, namaLomba) {
            const listPeserta = document.getElementById('list-peserta');
            
            if(!data || data.length === 0) {
                listPeserta.innerHTML = `<div class="text-center mt-10"><i class="fa-regular fa-folder-open text-4xl text-gray-300 mb-2"></i><p class="text-gray-500">Belum ada data pendaftar.</p></div>`;
                document.getElementById('bagan-container').innerHTML = '';
                document.getElementById('judul-peserta').innerText = "Daftar Tim & Peserta";
                return;
            }

            // KELOMPOKKAN ANGGOTA BERDASARKAN TIM/REGU/PASANGAN
            const teamsMap = {};
            const uniqueTeamsArray = [];

            data.forEach(p => {
                const teamName = p.tim; 
                if (!teamsMap[teamName]) {
                    teamsMap[teamName] = [];
                    uniqueTeamsArray.push(teamName);
                }
                teamsMap[teamName].push(p.nama);
            });

            // 1. TAMPILKAN JUMLAH TIM/PESERTA DI JUDUL DAFTAR
            document.getElementById('judul-peserta').innerHTML = `Daftar Peserta <span class="text-sm bg-blue-600 text-white px-2 py-1 rounded-full ml-2 shadow-sm">${uniqueTeamsArray.length} Tim/Peserta</span>`;

            // TAMPILKAN LIST DI SEBELAH KIRI
            listPeserta.innerHTML = '';
            uniqueTeamsArray.forEach(tim => {
                const jmlAnggota = teamsMap[tim].length;
                const teamDiv = document.createElement('div');
                teamDiv.className = "mb-3 border border-blue-200 rounded-lg overflow-hidden";
                
                // Tampilan Nama Tim dan Jumlah Anggota
                teamDiv.innerHTML = `
                    <div class="bg-blue-100 px-4 py-3 font-bold text-blue-900 flex justify-between items-center ${jmlAnggota === 1 ? 'border-b border-blue-200' : ''}">
                        <span><i class="fa-solid ${jmlAnggota > 1 ? 'fa-users' : 'fa-user'} mr-2"></i>${tim}</span>
                        <span class="text-xs bg-white text-blue-600 px-2 py-1 rounded-full shadow-sm font-black">${jmlAnggota} Anggota</span>
                    </div>
                `;

                // 2. LOGIKA MENYEMBUNYIKAN NAMA PESERTA JIKA LEBIH DARI 1 ORANG
                if (jmlAnggota === 1) {
                    // Hanya tampilkan nama jika peserta tunggal (individu)
                    const ul = document.createElement('ul');
                    ul.className = "px-4 py-2 bg-white";
                    const li = document.createElement('li');
                    li.className = "text-sm text-gray-700 flex items-center font-medium";
                    li.innerHTML = `<i class="fa-solid fa-angle-right text-gray-400 mr-2 text-xs"></i> ${teamsMap[tim][0]}`;
                    ul.appendChild(li);
                    teamDiv.appendChild(ul);
                }
                
                listPeserta.appendChild(teamDiv);
            });

            // BUAT BAGAN OTOMATIS BERDASARKAN TIPE LOMBA
            renderBaganCerdas(uniqueTeamsArray, namaLomba);
        }
        // LOGIKA CERDAS: MENGUBAH TAMPILAN BERDASARKAN JENIS LOMBA
        function renderBaganCerdas(daftarTim, namaLomba) {
            const container = document.getElementById('bagan-container');
            const infoBagan = document.getElementById('info-bagan-tipe');
            let html = '<div class="space-y-4">';
            let matchNumber = 1;
            
            let jenisLomba = namaLomba.toLowerCase();

            // 1. FORMAT LUDO (4 ORANG DALAM 1 PERTANDINGAN)
            if (jenisLomba.includes("ludo")) {
                infoBagan.innerHTML = '<i class="fa-solid fa-dice mr-1 text-red-500"></i>Format: 4 Pemain per Match (1 vs 1 vs 1 vs 1)';
                for (let i = 0; i < daftarTim.length; i += 4) {
                    let p1 = daftarTim[i];
                    let p2 = daftarTim[i+1] || "KOSONG";
                    let p3 = daftarTim[i+2] || "KOSONG";
                    let p4 = daftarTim[i+3] || "KOSONG";
                    let matchName = "MATCH " + matchNumber;
                    
                    html += `
                    <div class="match-card rounded-lg p-4 shadow border border-gray-200">
                        <div class="text-xs font-bold text-red-500 mb-3 border-b pb-1">${matchName}</div>
                        <div class="grid grid-cols-2 gap-2 text-center text-sm font-bold text-gray-800">
                            <div class="bg-gray-100 p-2 rounded">${p1}</div>
                            <div class="bg-gray-100 p-2 rounded">${p2}</div>
                            <div class="bg-gray-100 p-2 rounded">${p3}</div>
                            <div class="bg-gray-100 p-2 rounded">${p4}</div>
                        </div>
                        <div class="mt-3 pt-3 border-t border-gray-100 grid grid-cols-2 md:grid-cols-4 gap-1">
                            ${buatTombolMenang(namaLomba, matchName, p1)}
                            ${buatTombolMenang(namaLomba, matchName, p2)}
                            ${buatTombolMenang(namaLomba, matchName, p3)}
                            ${buatTombolMenang(namaLomba, matchName, p4)}
                        </div>
                    </div>`;
                    matchNumber++;
                }
            } 
            
            // 2. FORMAT KARAOKE (TAMPIL INDIVIDU, BUKAN VS)
            else if (jenisLomba.includes("karaoke")) {
                infoBagan.innerHTML = '<i class="fa-solid fa-microphone mr-1 text-purple-500"></i>Format: Penampilan Individu / Berurutan';
                for (let i = 0; i < daftarTim.length; i++) {
                    let p1 = daftarTim[i];
                    html += `
                    <div class="match-card rounded-lg p-4 shadow border border-purple-200 flex justify-between items-center">
                        <div>
                            <div class="text-xs font-bold text-purple-500 mb-1">URUTAN TAMPIL ${matchNumber}</div>
                            <div class="font-bold text-gray-800 text-lg">${p1}</div>
                        </div>
                        <button onclick="simpanPemenang(this, '${namaLomba}', 'Penampilan', '${p1}', '', '${p1} (Lolos Audisi)')" class="bg-purple-50 hover:bg-purple-500 hover:text-white text-purple-700 text-xs font-bold py-2 px-3 rounded border border-purple-200 transition duration-200">
                            🎤 Pilih
                        </button>
                    </div>`;
                    matchNumber++;
                }
            }
            
            // 3. FORMAT STANDAR (TIM VS TIM / 1 VS 1) - VOLLY, DOMINO, BADMINTON, PS 5, CERDAS CERMAT
            else {
                infoBagan.innerHTML = '<i class="fa-solid fa-handshake-angle mr-1 text-blue-500"></i>Format: Matchup Duel (Tim A vs Tim B)';
                for (let i = 0; i < daftarTim.length; i += 2) {
                    let p1 = daftarTim[i];
                    let p2 = daftarTim[i+1] || "BYE (Layak Automatik)";
                    let matchName = "MATCH " + matchNumber;
                    
                    let actionButtons = "";
                    if (p2 !== "BYE (Layak Automatik)") {
                        actionButtons = `
                        <div class="mt-4 pt-3 border-t border-gray-100 flex justify-center gap-2">
                            ${buatTombolMenang(namaLomba, matchName, p1)}
                            ${buatTombolMenang(namaLomba, matchName, p2)}
                        </div>`;
                    } else {
                        actionButtons = `<div class="mt-4 pt-2 text-center text-xs font-bold text-gray-400 border-t border-gray-100">Menunggu Lawan Berikutnya</div>`;
                    }

                    html += `
                    <div class="match-card rounded-lg p-4 shadow border border-gray-200">
                        <div class="text-xs font-bold text-blue-500 mb-2">${matchName}</div>
                        <div class="flex items-center justify-between">
                            <div class="flex-1 text-center font-bold text-gray-800 px-2 break-words text-sm md:text-base">${p1}</div>
                            <div class="bg-gray-800 text-white rounded px-2 py-0.5 text-xs font-black mx-1 shadow-sm">VS</div>
                            <div class="flex-1 text-center font-bold text-gray-800 px-2 break-words text-sm md:text-base">${p2}</div>
                        </div>
                        ${actionButtons}
                    </div>`;
                    matchNumber++;
                }
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // FUNGSI PEMBANTU UNTUK MEMBUAT TOMBOL MENANG
        function buatTombolMenang(lomba, matchName, namaPemain) {
            if(namaPemain === "KOSONG") return `<div></div>`; // Jangan buat tombol jika pemain tidak ada
            return `
            <button onclick="simpanPemenang(this, '${lomba}', '${matchName}', 'Semua Peserta', '', '${namaPemain}')" class="flex-1 bg-green-50 hover:bg-green-500 hover:text-white text-green-700 text-xs font-bold py-1.5 px-2 rounded border border-green-200 transition duration-200">
                🏆 ${namaPemain}
            </button>`;
        }

        function simpanPemenang(btnElement, lomba, matchName, tim1, tim2, timPemenang) {
            let konfirmasi = confirm(`Tetapkan "${timPemenang}" sebagai Pemenang/Lolos di ${matchName}?`);
            if (!konfirmasi) return;

            let originalText = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>...';
            btnElement.disabled = true;

            const payload = {
                action: 'update_pemenang',
                lomba: lomba,
                match: matchName,
                tim1: tim1,
                tim2: tim2,
                pemenang: timPemenang
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.text())
            .then(result => {
                alert(result);
                btnElement.innerHTML = '✅ Sukses';
                btnElement.classList.remove('bg-green-50', 'text-green-700');
                btnElement.classList.add('bg-green-600', 'text-white');
            })
            .catch(err => {
                alert("Gagal merekam ke Spreadsheet. Silakan coba lagi.");
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            });
        }
    </script>
</body>
</html>
