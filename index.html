<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Lomba HLN UP3 Tobelo 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(229, 231, 235, 1); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .hidden-section { display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .match-card { background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); border-left: 4px solid #3b82f6; transition: transform 0.2s; }
        .match-card:hover { transform: scale(1.02); }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen font-sans text-gray-800">

    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/97/Logo_PLN.png" alt="Logo PLN" class="h-10 md:h-12 object-contain">
            <div class="text-center flex-1 mx-4">
                <h1 class="text-lg md:text-2xl font-extrabold text-blue-900 tracking-tight">HLN UP3 TOBELO 2026</h1>
                <p class="text-xs md:text-sm text-gray-600 font-medium mt-1">Dashboard Pendaftaran & Bagan Lomba</p>
            </div>
            <img src="danantara.png" alt="Logo Danantara" class="h-10 md:h-12 object-contain rounded-md">
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 text-center max-w-2xl mx-auto border-t-4 border-blue-600">
            <label for="lomba-select" class="block text-lg font-bold text-gray-700 mb-3">
                <i class="fa-solid fa-trophy text-yellow-500 mr-2"></i>Pilih Cabang Lomba:
            </label>
            <select id="lomba-select" onchange="showLombaDetails()" class="w-full text-lg p-3 border-2 border-blue-200 rounded-lg focus:outline-none focus:border-blue-600 bg-blue-50 font-semibold text-blue-900">
                <option value="">-- Silakan Pilih Lomba --</option>
                <option value="Ludo">Ludo</option>
                <option value="Domino">Domino</option>
                <option value="Volly">Bola Volly</option>
                <option value="PS 5">PlayStation 5</option>
                <option value="Badminton">Badminton</option>
                <option value="Tenis Meja">Tenis Meja</option>
                <option value="Karaoke">Karaoke</option>
                <option value="Cerdas Cermat">Cerdas Cermat</option>
            </select>
        </div>

        <div id="detail-section" class="hidden-section">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Daftar Peserta -->
                <div class="glass-card rounded-2xl p-6 flex flex-col h-[600px]">
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <h3 class="text-xl font-bold text-blue-900" id="judul-peserta">Daftar Peserta</h3>
                        <button onclick="tambahData()" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg font-bold transition flex items-center text-sm shadow">
                            <i class="fa-solid fa-user-plus mr-2"></i>Tambah
                        </button>
                    </div>
                    <div class="bg-white rounded-lg p-2 border border-gray-100 flex-1 overflow-y-auto" id="list-peserta">
                        <div class="text-center text-gray-500 mt-10">Memuat data...</div>
                    </div>
                </div>

                <!-- Bagan Lomba -->
                <div class="glass-card rounded-2xl p-6 flex flex-col h-[600px]">
                    <div class="mb-4 border-b pb-3">
                        <h3 class="text-xl font-bold text-blue-900" id="judul-bagan">Bagan Pertandingan</h3>
                        <p class="text-xs text-gray-500 mt-1"><i class="fa-solid fa-circle-info mr-1"></i>Sistem gugur / Matchup Round 1</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4 border border-gray-200 flex-1 overflow-y-auto relative shadow-inner" id="bagan-container">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // URL WEB APP BARU ANDA
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxqEeykjmYojUkO3SNrg20HwOHmOntRpGRNfLclIDlSa8RZ2C3YD9Zq6KtCGG6BQSVf/exec';
        let dataPesertaAktif = []; 

        function showLombaDetails() {
            const select = document.getElementById('lomba-select');
            const section = document.getElementById('detail-section');
            const listPeserta = document.getElementById('list-peserta');
            const baganContainer = document.getElementById('bagan-container');
            
            if(select.value !== "") {
                section.classList.remove('hidden-section');
                const namaSheet = select.value; 
                
                document.getElementById('judul-peserta').innerText = "Peserta " + select.options[select.selectedIndex].text;
                document.getElementById('judul-bagan').innerText = "Bagan " + select.options[select.selectedIndex].text;
                
                listPeserta.innerHTML = '<div class="loader"></div><p class="text-center text-gray-500 text-sm mt-2">Menarik data dari Sheet ' + namaSheet + '...</p>';
                baganContainer.innerHTML = '<div class="loader"></div>';

                fetch(SCRIPT_URL + "?sheet=" + encodeURIComponent(namaSheet))
                    .then(response => response.json())
                    .then(result => {
                        if(result.error) {
                            listPeserta.innerHTML = `<p class="text-red-500 text-center font-bold mt-5"><i class="fa-solid fa-triangle-exclamation"></i> ${result.error}</p>`;
                            baganContainer.innerHTML = '';
                            return;
                        }
                        renderPeserta(result.data);
                        renderBagan(dataPesertaAktif);
                    })
                    .catch(error => {
                        listPeserta.innerHTML = `<p class="text-red-500 text-center">Gagal koneksi ke server Apps Script.</p>`;
                        baganContainer.innerHTML = '';
                    });
            } else {
                section.classList.add('hidden-section');
            }
        }

        function renderPeserta(data) {
            const listPeserta = document.getElementById('list-peserta');
            listPeserta.innerHTML = ''; 
            dataPesertaAktif = []; 

            if(data.length <= 1) {
                listPeserta.innerHTML = `<div class="text-center mt-10"><i class="fa-regular fa-folder-open text-4xl text-gray-300 mb-2"></i><p class="text-gray-500">Belum ada pendaftar di sheet ini.</p></div>`;
                return;
            }

            const ul = document.createElement('ul');
            ul.className = "divide-y divide-gray-100";
            
            // Asumsi baris 1 (index 0) adalah Header
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                
                // Ambil Kolom pertama dan kedua yang berisi data. Sesuaikan indeks array jika format sheet Anda berbeda
                // index 0: Timestamp/Nomor (tergantung isi), index 1: Nama, index 2: Unit
                let nama = row[1] ? row[1].toString().trim() : "";
                let unit = row[2] ? row[2].toString().trim() : "";
                
                if(nama === "") nama = "Peserta " + i;

                dataPesertaAktif.push(nama);

                const li = document.createElement('li');
                li.className = "py-3 flex items-center hover:bg-blue-50 px-3 rounded-lg transition duration-150";
                li.innerHTML = `
                    <div class="bg-blue-600 text-white h-8 w-8 rounded-md flex items-center justify-center font-bold text-sm mr-4 shadow-sm">
                        ${i}
                    </div>
                    <div>
                        <p class="text-gray-800 font-bold">${nama}</p>
                        ${unit ? `<p class="text-xs text-gray-500"><i class="fa-solid fa-location-dot mr-1"></i>${unit}</p>` : ''}
                    </div>
                `;
                ul.appendChild(li);
            }
            listPeserta.appendChild(ul);
        }

        function renderBagan(peserta) {
            const container = document.getElementById('bagan-container');
            
            if (peserta.length < 2) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-gray-400">
                        <i class="fa-solid fa-sitemap text-5xl mb-3 opacity-50"></i>
                        <p>Peserta belum cukup untuk membuat bagan pertandingan.</p>
                    </div>`;
                return;
            }

            let html = '<div class="space-y-4">';
            let matchNumber = 1;
            for (let i = 0; i < peserta.length; i += 2) {
                let p1 = peserta[i];
                let p2 = peserta[i+1] || "<span class='text-green-500 italic'>BYE (Otomatis Lolos)</span>";
                
                html += `
                <div class="match-card rounded-lg p-3 shadow border border-gray-200">
                    <div class="text-xs font-bold text-blue-500 mb-2 border-b pb-1">MATCH ${matchNumber}</div>
                    <div class="flex items-center justify-between">
                        <div class="flex-1 text-center font-bold text-gray-700 px-2 break-words text-sm md:text-base">${p1}</div>
                        <div class="bg-red-500 text-white rounded-full px-2 py-1 text-xs font-black mx-2 shadow-sm">VS</div>
                        <div class="flex-1 text-center font-bold text-gray-700 px-2 break-words text-sm md:text-base">${p2}</div>
                    </div>
                </div>`;
                matchNumber++;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        function tambahData() {
            const select = document.getElementById('lomba-select');
            const namaLomba = select.value; // Ambil value sheet (misal "Volly")
            
            const nama = prompt(`Masukkan Nama Peserta untuk lomba ${select.options[select.selectedIndex].text}:`);
            if (!nama) return;
            
            const unit = prompt("Masukkan Unit/UP3/ULP:");
            if (!unit) return;

            const listPeserta = document.getElementById('list-peserta');
            listPeserta.innerHTML = '<div class="loader"></div><p class="text-center text-blue-500 text-sm mt-2">Menyimpan langsung ke Sheet ' + namaLomba + '...</p>';

            const dataToSend = { nama: nama, lomba: namaLomba, unit: unit };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(dataToSend)
            })
            .then(response => response.text())
            .then(result => {
                alert("Status: " + result);
                showLombaDetails(); 
            })
            .catch(error => {
                alert("Terjadi kesalahan saat menyimpan data.");
                showLombaDetails();
            });
        }
    </script>
</body>
</html>
